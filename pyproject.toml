[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexte-esb"
version = "0.7.1"
description = "nextE Energy Supply Bid Management Tool - Python engine and Streamlit application (GW-ESB-01, T12)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - nextE Asset Management SRL. All rights reserved." }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "pyyaml>=6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
app = ["streamlit>=1.50", "plotly>=5.20"]

[tool.setuptools.packages.find]
include = ["esb*", "config*", "extractors*", "tools*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "parity: ties the engine to the frozen Reference Case (Phase 4)",
    "edge: adversarial and edge-case suites (Phase 3)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
