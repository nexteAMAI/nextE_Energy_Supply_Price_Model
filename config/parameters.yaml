  tax_payment_day: 25                       # C18 - VAT and CIT payment day (ANAF)
  cit_rate: 0.16                            # C19 - Legea 227/2015 art. 41 per workbook label; source_status: unverified
  opening_cash_eur: 0.0                     # C20
  opening_cash_ron: 0.0                     # C21 - not consumed (single EUR account)
  portfolio_opex_eur_per_mwh_metered: 0.12  # C25
  variable_opex_eur_per_mwh_metered: 0.10   # C26 (sales bonus)
  shareholder_loan_rate_pa: 0.07            # C27
