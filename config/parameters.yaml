general:                                    # Input section A
  case_start: "2027-01-01"                  # C14 (46388)
  case_end: "2027-12-31"                    # C15 = MAX(contract end dates) (46752)
  fx_ron_per_eur: 5.5                       # C16 - Forecast Q3 2026 (D54)
