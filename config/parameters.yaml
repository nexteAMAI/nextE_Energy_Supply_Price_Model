tariff_components_eur_per_mwh:
  TL: 6.64363636363636                      # transport extraction
  TG: 0.66                                  # transport injection
  SS: 2.6727272727272702                    # system services
  T_HV: 7.15818181818182                    # distribution HV
  T_MV: 22.3272727272727                    # distribution MV
  T_LV: 0.0                                 # distribution LV
  cogeneration: 2.47272727272727
  cfd: 0.0254545454545455
  excise: 0.69818181818181801
  # GC = 0.499387 x 148.2201 / 5.5 = 13.458034741581818 (Input!C60)

