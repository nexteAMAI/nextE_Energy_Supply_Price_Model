# Parameter register - Reference Case values, as read from the frozen workbook
# Energy_Supply_Portfolio_Tracking_v03_[base].xlsx (md5 1c873718bcd08957229f1f46d5449b2a),
# sheet Input and the price / strip tables. Every parameter is dynamic in the application; this
# file is the Reference Case scenario only. Off-takers by code (merit-order position); names
# never appear here. Cell references are the workbook origin of each value.
# Vintage of regulatory values: "Forecast Q3 2026 basis" (workbook decisions D55 / D60);
# source_status: unverified = quoted from the workbook, not checked against a primary source.

meta:
