# Regulated tariff components 2026, RON/MWh, as set by the ANRE orders - the VERIFIED table of the pass of 17.09.2026
# (T12.7). NOT loaded by the application: config/tariffs_ro.yaml (the v1.1 template table, D109) stays the source
# until the CEO rules on open item TAR-2026. The application's cascade (T_HV from HV DSO down, T_MV from MV DSO
# down, T_LV at LV DSO only) SUMS the rows it selects, so this table carries the SPECIFIC tariffs of each order:
# the sum at a level equals the applied (cumulated) tariff the suppliers publish - e.g. DEER at MV DSO
# 31,96 + 83,36 = 115,32 lei/MWh. The v1.1 table carried the applied tariffs and summed them again.
#
# Sources (all M. Of. Partea I nr. 1173/18.12.2025, in force 01.01.2026, excl. VAT):
#   ANRE Ordinul nr. 74/16.12.2025 - transmission: TG (introducere) 3,63; TL (extragere) 36,45; reactive 0,1821 lei/kVArh
#   ANRE Ordinul nr. 73/2025      - system services 14,70 (12,79 from 01.09.2025); Ordinele nr. 12/2026 and 53/2026 not read
#   ANRE Ordinul nr. 77/2025      - Distributie Energie Electrica Romania: IT 31,96 / MT 83,36 / JT 240,02 (reactive 0,2023)
#   ANRE Ordinul nr. 76/2025      - Delgaz Grid: IT 40,46 / MT 85,25 / JT 262,20
#   ANRE Ordinul nr. 75/2025      - Distributie Oltenia: IT 39,37 / MT 83,43 / JT 210,45
#   ANRE Ordinul nr. 78/2025      - Retele Electrice Romania: IT 23,83 / MT 68,36 / JT 225,20 (secondary copies; the
#                                   applied tariffs 23,83 / 92,19 / 317,39 agree across suppliers' sheets)
# Cogeneration contribution, CfD contribution and excise: NOT covered by the pass - carried from the v1.1 table, unverified.
# 2027 tariffs: not approved as of 17.09.2026 (ANRE order portal up to Ordinul nr. 57/03.09.2026).
meta:
  currency: RON
  unit: RON/MWh
  validity: 2026
  source: "ANRE Ordinele nr. 73, 74, 75, 76, 77, 78/2025 (M. Of. Partea I nr. 1173/18.12.2025)"
  source_status: verified
  checked: "17.09.2026"
  basis: specific   # distribution rows are the specific tariffs of the orders; the cascade sums them to the applied tariff
voltage_levels: ["HV (>=110 kV) TSO", "HV (110 kV) DSO", "MV (6-20 kV) DSO", "LV (0,4 kV) DSO"]
distribution_operators: ["Distributie Energie Electrica Romania", "Distributie Energie Oltenia", "Delgaz Grid", "Retele Electrice Romania"]
components:
  TL: {en: "Transport grid extraction tariff (TL)", ro: "Tarif de extragere energie electrica din retea (TL)"}
  TG: {en: "Transport grid injection tariff (TG)", ro: "Tarif de introducere energie electrica in retea (TG)"}
  SS: {en: "System services tariff (SS)", ro: "Tarif pentru servicii sistem (SS)"}
  T_HV: {en: "Distribution grid high voltage tariff (T_HV)", ro: "Tarif specific de distributie inalta tensiune (IT)"}
  T_MV: {en: "Distribution grid medium voltage tariff (T_MV)", ro: "Tarif specific de distributie medie tensiune (MT)"}
  T_LV: {en: "Distribution grid low voltage tariff (T_LV)", ro: "Tarif specific de distributie joasa tensiune (JT)"}
  cogeneration: {en: "Cogeneration contribution", ro: "Contributie pentru cogenerare"}
  cfd: {en: "CfD contribution", ro: "Contributie pentru contracte pentru diferenta (CfD)"}
  excise: {en: "Excise duty (non-RES supply)", ro: "Acciza comerciala (exclusiv energie din surse regenerabile)"}
tariffs:
  - {owner: "TSO", component: TL, ron_per_mwh: 36.45, validity: 2026, applies: [true, true, true, true], source: "ANRE Ordinul nr. 74/2025", source_status: verified}
