  - {owner: "Distributie Energie Electrica Romania", component: T_HV, ron_per_mwh: 31.96, validity: 2026, source: "ANRE Ordinul nr. 77/2025", source_status: verified}
  - {owner: "Distributie Energie Electrica Romania", component: T_MV, ron_per_mwh: 83.36, validity: 2026, source: "ANRE Ordinul nr. 77/2025", source_status: verified}
  - {owner: "Distributie Energie Electrica Romania", component: T_LV, ron_per_mwh: 240.02, validity: 2026, source: "ANRE Ordinul nr. 77/2025", source_status: verified}
  - {owner: "Distributie Energie Oltenia", component: T_HV, ron_per_mwh: 39.37, validity: 2026, source: "ANRE Ordinul nr. 75/2025", source_status: verified}
  - {owner: "Distributie Energie Oltenia", component: T_MV, ron_per_mwh: 83.43, validity: 2026, source: "ANRE Ordinul nr. 75/2025", source_status: verified}
