# Romanian calendar facts used by the grid module and the calendar block of the QH exports.
# Public holidays are listed as rules, not as dated lists, so every spine year is covered; the movable
# feasts follow the Orthodox (Julian) Easter, computed in esb.calendar_ro. Nothing here is consumed by
# the engine's prices or volumes - the flag is descriptive (grid calendar block, QH_full / QH_daily).
meta:
  timezone_grid: EET
  offset_eet_cet_h: 1
  peak_window_cet: ["08:00", "20:00"]
public_holidays:
  source: "Legea nr. 53/2003 - Codul muncii, republicata, art. 139 alin. (1) (zile de sarbatoare legala in care nu se lucreaza)"
  source_status: "to_verify - article numbering, the current list and the act that added 6 and 7 January to be confirmed against Monitorul Oficial before the flag is relied on outside descriptive use"
  fixed:                                   # month-day, every year
    - {date: "01-01", name: "Anul Nou"}
    - {date: "01-02", name: "Anul Nou (a doua zi)"}
    - {date: "01-06", name: "Boboteaza", note: "added by later amendment - verify the act"}
    - {date: "01-07", name: "Sfantul Ioan Botezatorul", note: "added by later amendment - verify the act"}
    - {date: "01-24", name: "Ziua Unirii Principatelor Romane"}
    - {date: "05-01", name: "Ziua Muncii"}
    - {date: "06-01", name: "Ziua Copilului"}
    - {date: "08-15", name: "Adormirea Maicii Domnului"}
    - {date: "11-30", name: "Sfantul Andrei"}
    - {date: "12-01", name: "Ziua Nationala"}
    - {date: "12-25", name: "Craciunul"}
    - {date: "12-26", name: "Craciunul (a doua zi)"}
  movable:                                 # offsets in days from the Orthodox Easter Sunday
    - {offset: -2, name: "Vinerea Mare"}
    - {offset: 0, name: "Pastele (prima zi)"}
    - {offset: 1, name: "Pastele (a doua zi)"}
    - {offset: 49, name: "Rusaliile (prima zi)"}
    - {offset: 50, name: "Rusaliile (a doua zi)"}
  easter_rule: "Orthodox (Julian) Easter by the Meeus Julian algorithm, converted to the Gregorian calendar with the 13-day offset valid 1900-2099"
years: {}
