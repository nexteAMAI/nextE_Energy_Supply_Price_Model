  currency: RON
  unit: RON/MWh
  validity: 2026
  source: "v1.1 template, sheet Grid_Taxes_RO"
  source_status: unverified
voltage_levels: ["HV (>=110 kV) TSO", "HV (110 kV) DSO", "MV (6-20 kV) DSO", "LV (0,4 kV) DSO"]
