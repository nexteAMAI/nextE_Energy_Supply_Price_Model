# Regulated tariff and charge components, RON/MWh, by regulatory charge owner and voltage level.
# Source: sheet Grid_Taxes_RO of the v1.1 template ([Template_v1.1_09062026]_nextE_Energy_Supply_Pricing,
# md5 190a1230), rows 4-22, validity 2026, read 15.09.2026 (C2 in the authority chain, D109).
# source_status: unverified against the ANRE orders that set these values (X-05 class) - the CEO or an
# adviser confirms them before a bid relies on them. EUR values are derived at the register FX.
#
# Applicability (v1.1 Dashboard_Input rows 304-313): every non-distribution component applies at every
# voltage level per its flags below; the distribution tariffs cascade - T_HV applies at HV DSO, MV DSO and
# LV DSO; T_MV at MV DSO and LV DSO; T_LV at LV DSO only; none at HV TSO. The v1.1 sheet labels the low
# voltage level "LV (6÷20kV) DSO" - an evident typo; the application shows "LV (0,4 kV) DSO".
